<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LP21 Lernwelt - Spiel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/games.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="../index.html" class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">LP21 Lernwelt</span>
            </a>
            <nav class="site-nav">
                <a href="../index.html" class="site-nav-link">Startseite</a>
                <a href="weltkarte.html" class="site-nav-link">🗺️ Weltkarte</a>
            </nav>
            <nav class="breadcrumb" id="breadcrumb">
                <a href="../index.html" class="breadcrumb-item">Startseite</a>
                <a href="#" class="breadcrumb-item" id="breadcrumbFach">Fach</a>
                <span class="breadcrumb-item active" id="breadcrumbSpiel">Spiel</span>
            </nav>
            <div id="playerNameContainer"></div>
            <div id="levelBadgeContainer"></div>
            <div id="soundToggleContainer"></div>
        </div>
    </header>

    <main class="container">
        <div class="game-wrapper">
            <div class="game-info" id="gameInfo">
                <div class="kompetenz-code" id="kompetenzCode">Lädt...</div>
                <div class="kompetenz-text" id="kompetenzText"></div>
            </div>

            <div class="game-container" id="gameContainer">
                <p style="text-align:center;color:#757575;">Spiel wird geladen...</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <p>LP21 Lernwelt - Basierend auf dem <a href="https://zg.lehrplan.ch/" target="_blank">Lehrplan 21 Kanton Zug</a></p>
        <p class="footer-educandus">Eine Demo von <a href="https://www.educandus.ch" target="_blank">educandus.ch</a> — Gamification-Beratung für Bildung</p>
    </footer>

    <!-- Utilities -->
    <script src="../js/utils/storage.js"></script>
    <script src="../js/utils/xp-system.js"></script>
    <script src="../js/utils/streak.js"></script>
    <script src="../js/utils/sound.js"></script>
    <script src="../js/utils/achievements.js"></script>
    <script src="../js/utils/difficulty.js"></script>
    <script src="../js/utils/player.js"></script>
    <script src="../js/utils/daily-challenge.js"></script>
    <script src="../js/utils/unlock-system.js"></script>
    <script src="../js/utils/progress-map.js"></script>
    <script src="../js/utils/story.js"></script>
    <script src="../js/utils/shuffle.js"></script>
    <script src="../js/utils/dom-helpers.js"></script>
    <script src="../js/utils/feedback.js"></script>
    <script src="../js/game-engine.js"></script>

    <!-- Game Engines -->
    <script src="../js/games/quiz.js"></script>
    <script src="../js/games/zuordnung.js"></script>
    <script src="../js/games/memory.js"></script>
    <script src="../js/games/lueckentext.js"></script>
    <script src="../js/games/sortieren.js"></script>
    <script src="../js/games/rechnen.js"></script>
    <script src="../js/games/wortspiel.js"></script>
    <script src="../js/games/zuordnung-bild.js"></script>
    <script src="../js/games/timeline.js"></script>
    <script src="../js/games/coding-puzzle.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            Player.init('playerNameContainer');
            XPSystem.renderBadge('levelBadgeContainer');
            SoundManager.renderToggle('soundToggleContainer');

            const fachId = DOM.getParam('fach');
            const kompetenzId = DOM.getParam('kompetenz');
            const spielTyp = DOM.getParam('typ');

            if (!fachId || !kompetenzId) {
                location.href = '../index.html';
                return;
            }

            try {
                const faecherData = await GameEngine.loadFaecher();
                const fach = GameEngine.findFach(faecherData, fachId);

                if (fach) {
                    const kompetenz = GameEngine.findKompetenz(fach, kompetenzId);
                    document.title = `${kompetenz?.name || kompetenzId} - LP21 Lernwelt`;
                    document.documentElement.style.setProperty('--fach-farbe', fach.farbe);

                    DOM.$('#kompetenzCode').textContent = kompetenz?.code || '';
                    DOM.$('#kompetenzText').textContent = kompetenz?.beschreibung || '';
                    DOM.$('#breadcrumbFach').textContent = fach.name;
                    DOM.$('#breadcrumbFach').href = `fach.html?fach=${fachId}`;
                    DOM.$('#breadcrumbSpiel').textContent = kompetenz?.name || 'Spiel';
                }

                const gameData = await GameEngine.loadData(fachId, kompetenzId);

                // Show difficulty selector before starting
                await DifficultyManager.showSelector();

                DOM.$('#gameContainer').innerHTML = '';

                const engine = new GameEngine('gameContainer', {
                    fachId,
                    kompetenzId,
                    fachFarbe: fach?.farbe
                });

                const typ = spielTyp || gameData.typ || 'quiz';
                const games = {
                    quiz: QuizGame,
                    zuordnung: ZuordnungGame,
                    memory: MemoryGame,
                    lueckentext: LueckentextGame,
                    sortieren: SortierenGame,
                    rechnen: RechnenGame,
                    wortspiel: WortspielGame,
                    'zuordnung-bild': BildZuordnungGame,
                    timeline: TimelineGame,
                    'coding-puzzle': CodingPuzzleGame
                };

                const GameClass = games[typ];
                if (GameClass) {
                    new GameClass(engine, gameData);
                } else {
                    DOM.$('#gameContainer').innerHTML =
                        `<p style="text-align:center;color:#f44336;">Unbekannter Spieltyp: ${typ}</p>`;
                }

            } catch (err) {
                DOM.$('#gameContainer').innerHTML =
                    `<p style="text-align:center;color:#f44336;">Fehler beim Laden des Spiels: ${err.message}</p>`;
                console.error(err);
            }
        });
    </script>
</body>
</html>
