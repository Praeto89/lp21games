<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LP21 Lernwelt - Zyklus 3</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="index.html" class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">LP21 Lernwelt</span>
            </a>
            <nav class="breadcrumb" id="breadcrumb">
                <span class="breadcrumb-item active">Startseite</span>
            </nav>
            <div class="header-progress" id="headerProgress">
                <span class="progress-label">Gesamtfortschritt:</span>
                <div class="progress-bar-mini">
                    <div class="progress-bar-fill" id="totalProgress" style="width: 0%"></div>
                </div>
                <span class="progress-percent" id="totalPercent">0%</span>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Lehrplan 21 - Lernspiele</h1>
            <p>Zyklus 3 (Sekundarstufe I) - Kanton Zug</p>
            <p class="hero-sub">Wähle ein Fach und trainiere deine Kompetenzen mit interaktiven Spielen.</p>
        </section>

        <section class="fach-grid" id="fachGrid">
            <!-- Dynamisch aus faecher.json generiert -->
        </section>
    </main>

    <footer class="site-footer">
        <p>LP21 Lernwelt - Basierend auf dem <a href="https://zg.lehrplan.ch/" target="_blank">Lehrplan 21 Kanton Zug</a></p>
    </footer>

    <script src="js/utils/storage.js"></script>
    <script src="js/utils/dom-helpers.js"></script>
    <script src="js/game-engine.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
